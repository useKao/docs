name: Documentation checks

on:
  pull_request:
    paths:
      - "**/*.md"
      - "**/*.mdx"
      - "docs.json"
      - ".mintignore"
      - "images/**"
      - ".github/workflows/docs.yml"
  push:
    branches:
      - main
    paths:
      - "**/*.md"
      - "**/*.mdx"
      - "docs.json"
      - ".mintignore"
      - "images/**"
      - ".github/workflows/docs.yml"

permissions:
  contents: read

jobs:
  docs:
    name: Validate Mintlify docs
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Mint CLI
        run: npm install --global mint@4.2.800 --no-fund --no-audit

      - name: Check broken links
        run: mint broken-links

      - name: Validate documentation build
        run: mint validate

      - name: Check accessibility
        run: mint a11y
